# ===========================================================
#  スクリーニング条件と配点の設定ファイル
#  ここの数字を書き換えるだけで条件を調整できます。
#  （プログラム本体を触る必要はありません）
# ===========================================================

universe:
  # 対象にする市場。0111=プライム 0112=スタンダード 0113=グロース
  market_codes: ["0111", "0112", "0113"]
  # 除外する業種コード。9999 = その他（REIT・ETFなどが入る）
  exclude_sector33: ["9999"]

# -------------------- 必須条件 --------------------
required:
  # 業績：直近の本決算が何期連続で増収増益か
  # 5期分のデータで4回の比較ができるので、初期値は 4
  # （データが貯まれば 5 に上げられます）
  consecutive_growth_years: 4

  # PERの上限
  per_max: 15.0
  # PERがマイナス（赤字）や極端な値の銘柄は除外
  per_min: 0.0

  # レンジ判定
  high_lookback_days: 60      # 「直近3か月の高値」を見る営業日数
  drawdown_min_pct: 10.0      # 高値から最低これだけ下げている（%）
  range_window_days: 20       # 横ばいを判定する直近の営業日数
  range_width_max_pct: 12.0   # その期間の値幅が平均株価の何%以内なら「レンジ」か

  # 流動性フィルタ（板が薄すぎる銘柄を除く）
  min_avg_turnover_yen: 30000000   # 直近20営業日の平均売買代金 3,000万円以上

# -------------------- ポイント配点 --------------------
# 上から順に条件を見て、最初に当てはまったものの点数が入ります
scoring:
  dividend_yield:        # 配当利回り（%）
    - {min: 3.0, points: 15, label: "配当利回り3%以上"}
    - {min: 2.0, points: 10, label: "配当利回り2%以上"}
    - {min: 1.0, points: 5,  label: "配当利回り1%以上"}

  payout_ratio:          # 配当性向（%）
    - {min: 20.0, max: 50.0, points: 10, label: "配当性向20〜50%"}
    - {min: 0.0,  max: 20.0, points: 5,  label: "配当性向20%未満"}

  per:                   # PER（倍）
    - {max: 10.0, points: 10, label: "PER10倍以下"}
    - {max: 12.0, points: 5,  label: "PER12倍以下"}

  pbr:                   # PBR（倍）
    - {max: 1.0, points: 10, label: "PBR1倍割れ"}
    - {max: 1.5, points: 5,  label: "PBR1.5倍以下"}

  drawdown:              # 3か月高値からの下落率（%）
    - {min: 30.0, points: 5,  label: "高値から30%超下落"}
    - {min: 20.0, points: 10, label: "高値から20〜30%下落"}
    - {min: 10.0, points: 5,  label: "高値から10〜20%下落"}

  range_days:            # レンジに入ってからの営業日数
    - {min: 40, points: 10, label: "レンジ入り40日以上"}
    - {min: 20, points: 5,  label: "レンジ入り20日以上"}

  equity_ratio:          # 自己資本比率（%）
    - {min: 60.0, points: 10, label: "自己資本比率60%以上"}
    - {min: 40.0, points: 5,  label: "自己資本比率40%以上"}

  operating_margin:      # 営業利益率（%）
    - {min: 15.0, points: 10, label: "営業利益率15%以上"}
    - {min: 8.0,  points: 5,  label: "営業利益率8%以上"}

  profit_cagr:           # 営業利益の年平均成長率（%）
    - {min: 20.0, points: 10, label: "営業利益 年20%成長"}
    - {min: 10.0, points: 5,  label: "営業利益 年10%成長"}

# -------------------- 表示 --------------------
display:
  max_rows: 80           # ページに載せる最大銘柄数（点数の高い順）
